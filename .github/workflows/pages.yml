name: Deploy website

# Builds the docs from Markdown and publishes website/ to GitHub Pages.
# Enable it once in Settings → Pages → Source: GitHub Actions.

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'docs/**'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'CONTRIBUTING.md'
      - 'DEVELOPMENT.md'
      - 'example/README.md'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      # A project site can be pointed at a branch folder instead of this workflow. In that case the
      # artifact is built, uploaded and "deployed" successfully, but GitHub serves its own legacy
      # Jekyll build of that folder instead — which here means the repository's top-level docs/
      # folder, and therefore a 404 at the root. That failure mode is silent, so check it up front.
      - name: Require the Pages source to be GitHub Actions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! build_type=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .build_type 2>/dev/null); then
            echo "::warning::Could not read the Pages configuration; skipping the source check."
            exit 0
          fi

          echo "Pages build_type: $build_type"

          if [ "$build_type" != "workflow" ]; then
            echo "::error::GitHub Pages is publishing a branch (build_type='$build_type'), so this workflow's artifact is never served and the site 404s. Fix it in Settings → Pages → Source: choose 'GitHub Actions'."
            exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: website/package-lock.json

      # The docs are pre-rendered from Markdown. Building here means the published site is always
      # in step with the source, even if the committed HTML was not regenerated.
      - name: Install site dependencies
        working-directory: website
        run: npm ci --no-audit --no-fund

      # Fails if the committed docs no longer match the Markdown they were rendered from, naming the
      # stale files. Rendering happens here rather than being compared against a build in git, so the
      # failure explains itself.
      - name: Verify docs are up to date
        working-directory: website
        run: npm run check:docs

      - name: Check pages
        working-directory: website
        run: npm run check

      # Produce the published artifact from source, so a deploy can never ship stale HTML.
      - name: Render documentation
        working-directory: website
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: website

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
