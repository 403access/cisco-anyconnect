name: Deploy website

# Builds the docs from Markdown and publishes website/ to GitHub Pages.
# Enable it once in Settings → Pages → Source: GitHub Actions.

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'docs/**'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'CONTRIBUTING.md'
      - 'DEVELOPMENT.md'
      - 'example/README.md'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: website/package-lock.json

      # The docs are pre-rendered from Markdown. Building here means the published site is always
      # in step with the source, even if the committed HTML was not regenerated.
      - name: Install site dependencies
        working-directory: website
        run: npm ci --no-audit --no-fund

      # Fails if the committed docs no longer match the Markdown they were rendered from, naming the
      # stale files. Rendering happens here rather than being compared against a build in git, so the
      # failure explains itself.
      - name: Verify docs are up to date
        working-directory: website
        run: npm run check:docs

      - name: Check pages
        working-directory: website
        run: npm run check

      # Produce the published artifact from source, so a deploy can never ship stale HTML.
      - name: Render documentation
        working-directory: website
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: website

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
